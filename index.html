<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Information and policies for the Abraxas Discord application.">
  <meta name="theme-color" content="#24123d">
  <title>Abraxas</title>

  <style>
    :root {
      --bg: #0f0b16;
      --panel: #1e142a;
      --purple: #6f42c1;
      --purple-bright: #9b6de3;
      --gold: #d6aa3d;
      --gold-bright: #f1cf70;
      --text: #f7f3fb;
      --muted: #c9bfd4;
      --border: rgba(241, 207, 112, 0.22);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(111, 66, 193, 0.25), transparent 34rem),
        radial-gradient(circle at 85% 10%, rgba(214, 170, 61, 0.11), transparent 28rem),
        linear-gradient(180deg, #120c1c 0%, var(--bg) 45%, #0b0810 100%);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid var(--border);
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(111, 66, 193, 0.24), rgba(30, 20, 42, 0.96) 48%, rgba(214, 170, 61, 0.08)),
        var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      width: min(320px, 62vw);
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
      filter: drop-shadow(0 10px 30px rgba(214, 170, 61, 0.18));
    }

    .eyebrow {
      margin: 0 0 0.8rem;
      color: var(--gold-bright);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .lede {
      max-width: 560px;
      margin: 0 auto 2rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .links {
      display: grid;
      gap: 0.85rem;
      max-width: 430px;
      margin: 0 auto;
    }

    .policy-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      border: 1px solid rgba(241, 207, 112, 0.28);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.025);
      text-decoration: none;
      font-weight: 800;
      transition:
        transform 140ms ease,
        border-color 140ms ease,
        background 140ms ease;
    }

    .policy-link:hover,
    .policy-link:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(241, 207, 112, 0.7);
      background: rgba(214, 170, 61, 0.08);
    }

    .policy-link:focus-visible {
      outline: 3px solid var(--gold-bright);
      outline-offset: 3px;
    }

    .arrow {
      color: var(--gold-bright);
      font-size: 1.2rem;
    }

    footer {
      margin-top: 2rem;
      color: #a99db6;
      font-size: 0.86rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .policy-link { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="abraxas-logo.png" alt="Abraxas logo">
    <p class="eyebrow">Abraxas</p>
    <p class="lede">
      Information and policies for the Abraxas Discord application.
    </p>

    <nav class="links" aria-label="Legal documents">
      <a class="policy-link" href="privacypolicy.html">
        <span>Privacy Policy</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer>&copy; 2026 Abraxas</footer>
  </main>
</body>
</html>
